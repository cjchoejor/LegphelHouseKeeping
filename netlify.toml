# Netlify configuration

[build]
  # No build step — this is a plain static site.
  publish = "."
  functions = "netlify/functions"

[functions]
  # Bundle npm deps (neon, jwt, bcryptjs) into each function.
  node_bundler = "esbuild"

# Optional friendlier URL: /api/reservations -> the function
[[redirects]]
  from = "/api/reservations"
  to = "/.netlify/functions/reservations"
  status = 200
