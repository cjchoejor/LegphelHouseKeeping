<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#4a90e2" />
  <title>Legphel Housekeeping</title>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --blue: #4a90e2;
      --blue-dark: #357abd;
      --ink: #1f2933;
      --muted: #6b7280;
      --line: #e5e7eb;
      --bg: #f3f4f6;
      --warn-bg: #fff8e1;
      --warn-border: #f5c518;
      --header-h: 150px; /* measured live in JS */
    }

    html, body { margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding-bottom: 40px;
      font-size: 16px;
      line-height: 1.45;
    }

    /* ---- Top bar (sticky) ---- */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--blue);
      color: #fff;
      padding: 14px 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      height: 40px;
      width: auto;
      flex: 0 0 auto;
    }

    .brand-text { min-width: 0; }

    header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    header .sub {
      font-size: 12px;
      opacity: 0.9;
      margin-top: 2px;
    }

    /* ---- Controls ---- */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: flex-end;
      margin-top: 12px;
    }

    .field { display: flex; flex-direction: column; flex: 1 1 120px; }

    .field label {
      font-size: 11px;
      opacity: 0.9;
      margin-bottom: 3px;
    }

    input[type="date"] {
      padding: 9px 10px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      width: 100%;
    }

    .btnrow {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .btnrow button {
      flex: 1 1 0;
      min-width: 0;
      padding: 11px 8px;
      border: none;
      border-radius: 8px;
      background: #fff;
      color: var(--blue-dark);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .btnrow button:active { transform: scale(0.99); }

    /* ---- Body ---- */
    main { padding: 12px 12px 0; max-width: 640px; margin: 0 auto; }

    .status {
      text-align: center;
      color: var(--muted);
      padding: 30px 10px;
      font-size: 15px;
    }
    .status.error { color: #c0392b; }

    /* ---- Date section header (sticky under top bar) ---- */
    .day-header {
      position: sticky;
      top: var(--header-h);
      z-index: 10;
      background: var(--ink);
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      margin: 16px 0 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .day-stats { display: flex; gap: 6px; }
    .stat {
      font-size: 12px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 20px;
      white-space: nowrap;
      color: #fff;
    }
    .stat-rooms { background: #3b82f6; }   /* blue  = rooms */
    .stat-occ   { background: #16a34a; }   /* green = occupants */

    /* ---- Reservation card ---- */
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
      border-left: 5px solid var(--blue);
    }
    .card.blocked {
      border-left-color: var(--warn-border);
      background: var(--warn-bg);
    }
    .card.staying {
      border-left-color: #0d9488;
      background: #c4f1e0;
    }
    .stay-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      background: #14b8a6;
      color: #fff;
      padding: 2px 8px;
      border-radius: 20px;
      margin-left: 8px;
      vertical-align: middle;
    }
    .stay-tag-sm {
      font-size: 10px;
      font-weight: 700;
      background: #14b8a6;
      color: #fff;
      padding: 1px 6px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 6px;
    }
    .room-no {
      font-size: 20px;
      font-weight: 700;
      color: var(--blue-dark);
    }
    .card.blocked .room-no { color: #a17f00; }

    .beds { font-size: 13px; color: var(--ink); text-align: right; white-space: nowrap; }
    .beds .bed-badge {
      background: #fdeaea;
      color: #c0392b;
      padding: 3px 8px;
      border-radius: 8px;
      font-weight: 600;
    }

    .cust { font-size: 16px; font-weight: 600; margin-bottom: 8px; }

    .meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 12px;
      font-size: 13px;
    }
    .meta .k { color: var(--muted); }
    .meta .v { font-weight: 600; }

    .pref {
      margin-top: 10px;
      background: #fdeaea;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 14px;
    }
    .card.blocked .pref { background: rgba(255,255,255,0.6); }
    .pref .lbl {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .blocked-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      background: var(--warn-border);
      color: #4a3a00;
      padding: 2px 8px;
      border-radius: 20px;
      margin-left: 8px;
      vertical-align: middle;
    }

    .refnote { font-size: 11px; color: var(--muted); margin-top: 8px; }

    /* ---- Table view ---- */
    /* The table area is its OWN scroll box (both directions) so the header row
       and the Room column can pin to the box edges reliably on mobile. */
    .table-scroll {
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      height: calc(100dvh - var(--header-h) - 24px);
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
      background: #fff;
    }
    table.grid {
      border-collapse: separate;
      border-spacing: 0;
      width: 100%;
      font-size: 12.5px;
    }
    table.grid th, table.grid td {
      padding: 8px 10px;
      text-align: center;
      white-space: nowrap;
      border-bottom: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }
    /* sticky column-title row, pinned to the top of the scroll box */
    table.grid thead th {
      position: sticky;
      top: 0;
      z-index: 3;
      background: var(--ink);
      color: #fff;
      font-weight: 600;
    }
    /* frozen first column (Room) */
    table.grid th.sticky-col, table.grid td.sticky-col {
      position: sticky;
      left: 0;
      z-index: 2;
      background: #eef2ff;
      font-weight: 700;
      color: var(--blue-dark);
      border-right: 2px solid var(--blue);
      /* keep the frozen column narrow: rooms stack vertically instead of widening */
      white-space: normal;
      width: 52px;
      min-width: 52px;
      max-width: 52px;
      padding: 6px 4px;
      line-height: 1.3;
    }
    /* top-left cell sits above both */
    table.grid thead th.sticky-col { z-index: 4; background: var(--ink); color: #fff; }

    /* full-width date separator row inside the table */
    table.grid tr.date-row td {
      background: #2c3e50;
      color: #fff;
      text-align: left;
      font-weight: 600;
      padding: 0;
      position: sticky;
      top: var(--grid-head-h, 34px);   /* parks just under the column-title row */
      z-index: 4;
    }
    /* contents pinned to the left so they stay visible when scrolling sideways */
    table.grid tr.date-row .date-inner {
      position: sticky;
      left: 0;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      white-space: nowrap;
    }

    table.grid td.cell-pref {
      background: #fdeaea;
      white-space: normal;
      min-width: 160px;
      text-align: left;
      color: #8a1f1f;
    }

    /* zebra striping (alternate rows light grey) */
    table.grid tr.alt td { background: #f1f3f6; }
    table.grid tr.alt td.sticky-col { background: #e3e8f5; }
    table.grid tr.alt td.cell-pref { background: #fbe1e1; }

    /* in-stay rows (guest already checked in) — mint green, overrides zebra */
    table.grid tr.staying td { background: #b8eed9; }
    table.grid tr.staying td.sticky-col { background: #8fe0c2; color: #065f46; }
    table.grid tr.staying td.cell-pref { background: #fdeaea; }

    table.grid tr.blocked-row td { background: var(--warn-bg); }
    table.grid tr.blocked-row td.sticky-col { background: #fff4cc; color: #a17f00; }
    table.grid td.cell-name { text-align: left; white-space: normal; min-width: 130px; }

    /* off-screen full render used only for the Save-as-image snapshot */
    .capture {
      position: fixed;
      left: -10000px;
      top: 0;
      background: #fff;
      padding: 16px;
      width: max-content;
    }
    .capture .cap-title { font-size: 16px; font-weight: 700; color: var(--ink); margin: 0 0 12px; }
    .capture table.grid { box-shadow: none; }
    /* sticky breaks image capture — pin everything static for the snapshot */
    .capture table.grid th,
    .capture table.grid td,
    .capture table.grid .date-inner { position: static !important; }

    /* ---- Image preview / save popup ---- */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .modal-box {
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      width: 100%;
      max-width: 520px;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .modal-hint { margin: 0; font-size: 13px; color: var(--muted); text-align: center; }
    .modal-img {
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--line);
      border-radius: 8px;
      flex: 1 1 auto;
      min-height: 0;
    }
    .modal-img img { display: block; width: 100%; height: auto; }
    .modal-actions { display: flex; gap: 8px; }
    .modal-actions button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .modal-actions button.ghost { background: #e5e7eb; color: var(--ink); }

    /* ---- Login screen ---- */
    .login-screen {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .login-box {
      background: #fff;
      border-radius: 14px;
      padding: 26px 22px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
    }
    .login-logo { height: 56px; width: auto; align-self: center; margin-bottom: 10px; }
    .login-box h2 { margin: 0 0 18px; text-align: center; color: var(--ink); font-weight: 600; }
    .login-box label { font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
    .login-box input {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 17px;
    }
    .login-box input:focus { outline: none; border-color: var(--blue); }
    #loginPin { letter-spacing: 6px; text-align: center; }
    .login-error { color: #c0392b; font-size: 13px; min-height: 18px; margin: 8px 0 0; text-align: center; }
    #loginBtn {
      margin-top: 14px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    #loginBtn:disabled { opacity: 0.6; }

    /* ---- User bar (top of header) ---- */
    .userbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 13px;
    }
    .userbar #userLabel { font-weight: 600; opacity: 0.95; }
    .userbar-actions { display: flex; gap: 6px; }
    .userbar-actions button {
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }
    .userbar-actions button:active { transform: scale(0.97); }

    /* ---- Admin console fields ---- */
    .admin-field { display: flex; flex-direction: column; gap: 4px; }
    .admin-field label { font-size: 13px; color: var(--muted); }
    .admin-field input {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 16px;
    }
    .admin-msg { font-size: 13px; min-height: 18px; }
    .admin-msg.ok { color: #15803d; }
    .admin-msg.err { color: #c0392b; }
  </style>
</head>

<body>
  <div id="loginScreen" class="login-screen">
    <form class="login-box" id="loginForm" autocomplete="on">
      <img src="legphel-logo.png" alt="Legphel" class="login-logo">
      <h2>Housekeeping Login</h2>
      <label for="loginUser">Username</label>
      <input type="text" id="loginUser" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false">
      <label for="loginPin">PIN</label>
      <input type="password" id="loginPin" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password">
      <div id="loginError" class="login-error"></div>
      <button type="submit" id="loginBtn">Log in</button>
    </form>
  </div>

  <header>
    <div class="userbar">
      <span id="userLabel"></span>
      <span class="userbar-actions">
        <button id="adminBtn" type="button" style="display:none">⚙ Admin</button>
        <button id="logoutBtn" type="button">Logout</button>
      </span>
    </div>
    <div class="brand">
      <img src="legphel-logo.png" alt="Legphel logo" class="logo">
      <div class="brand-text">
        <h1>Legphel Housekeeping</h1>
        <div class="sub" id="rangeLabel">&nbsp;</div>
      </div>
    </div>
    <div class="controls">
      <div class="field">
        <label for="startDate">From</label>
        <input type="date" id="startDate">
      </div>
      <div class="field">
        <label for="endDate">To</label>
        <input type="date" id="endDate">
      </div>
    </div>
    <div class="btnrow">
      <button id="fetchBtn">Refresh</button>
      <button id="viewToggleBtn">▦ Table view</button>
      <button id="saveImgBtn" style="display:none">💾 Save</button>
    </div>
  </header>

  <main>
    <div id="content" class="status">Loading…</div>
  </main>

  <div id="adminModal" class="modal" style="display:none">
    <div class="modal-box">
      <h3 style="margin:0">⚙ Admin Console</h3>
      <p class="modal-hint" style="text-align:left">How many days around today housekeeping is allowed to view:</p>
      <div class="admin-field">
        <label for="daysBefore">Days before today</label>
        <input type="number" id="daysBefore" min="0" max="60" inputmode="numeric">
      </div>
      <div class="admin-field">
        <label for="daysAfter">Days after today</label>
        <input type="number" id="daysAfter" min="0" max="60" inputmode="numeric">
      </div>
      <div id="adminMsg" class="admin-msg"></div>
      <div class="modal-actions">
        <button id="savePolicyBtn">Save</button>
        <button id="closeAdminBtn" class="ghost">Close</button>
      </div>
    </div>
  </div>

  <div id="imgModal" class="modal" style="display:none">
    <div class="modal-box">
      <p class="modal-hint">Press &amp; hold the image to save it to Photos — or tap Share / Save.</p>
      <div class="modal-img"><img id="modalImg" alt="Table snapshot"></div>
      <div class="modal-actions">
        <button id="shareImgBtn">Share / Save</button>
        <button id="closeModalBtn" class="ghost">Close</button>
      </div>
    </div>
  </div>

  <script>
    // DEV = opened as a local file (file://): skip login and call the hotel API directly,
    // so the layout can still be previewed without a server. On the real https site,
    // login is required and all data goes through the secured Netlify proxy.
    const DEV = location.protocol === 'file:';
    const FN = '/.netlify/functions';
    const apiBase = DEV
      ? 'http://119.2.105.142:3800/api/reservations_summary_for_mam2'
      : FN + '/reservations';

    let lastData = null;        // cache so toggling views doesn't re-fetch
    let view = 'cards';         // 'cards' | 'table'
    let auth = null;            // { token, user:{username,full_name,role}, policy:{days_before,days_after} }

    // ---- auth storage ----
    function loadAuth() { try { return JSON.parse(localStorage.getItem('hk_auth')); } catch { return null; } }
    function saveAuth(a) { localStorage.setItem('hk_auth', JSON.stringify(a)); }
    function clearAuth() { localStorage.removeItem('hk_auth'); }
    function tokenValid(a) {
      if (!a || !a.token) return false;
      try {
        let part = a.token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
        part = part.padEnd(part.length + (4 - part.length % 4) % 4, '=');
        const payload = JSON.parse(atob(part));
        return payload.exp * 1000 > Date.now();
      } catch { return false; }
    }
    function roleLabel(r) {
      return r === 'admin' ? 'Admin' : r === 'gm' ? 'General Manager' : 'Housekeeping';
    }
    function addDays(date, n) { const d = new Date(date); d.setDate(d.getDate() + n); return d; }

    // ---- date helpers (Asia/Thimphu, UTC+6) ----
    function thimphuToday() {
      const now = new Date();
      const t = new Date(now.getTime() + (6 * 60 + now.getTimezoneOffset()) * 60000);
      return t;
    }
    function fmt(d) { return d.toISOString().split('T')[0]; }
    function nextDay(d) { const n = new Date(d); n.setDate(n.getDate() + 1); return n; }

    function escapeHtml(s) {
      if (s === null || s === undefined) return '';
      return String(s).replace(/[&<>"']/g, m =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }

    // Stack a "601, 602, 701" room list vertically so the frozen column
    // stays narrow (grows taller, never wider) on a phone.
    function stackRooms(roomNo) {
      return String(roomNo ?? '')
        .split(',')
        .map(r => escapeHtml(r.trim()))
        .filter(Boolean)
        .join('<br>') || '—';
    }

    function bedText(king, twin) {
      const k = Number(king) || 0, t = Number(twin) || 0;
      const parts = [];
      if (k > 0) parts.push(`${k} King`);
      if (t > 0) parts.push(`${t} Twin`);
      return parts.length ? `<span class="bed-badge">🛏 ${parts.join(' · ')}</span>` : '';
    }

    function prettyDate(value) {
      if (!value) return '';
      let d;
      // API returns DD-MM-YYYY; the date inputs give YYYY-MM-DD.
      if (/^\d{2}-\d{2}-\d{4}$/.test(value)) {
        const [dd, mm, yy] = value.split('-');
        d = new Date(`${yy}-${mm}-${dd}`);
      } else {
        d = new Date(value);
      }
      if (isNaN(d)) return value;
      return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    }

    function render(data) {
      const el = document.getElementById('content');
      if (!data || data.length === 0) {
        el.className = 'status';
        el.textContent = 'No reservations for the selected dates.';
        return;
      }

      let html = '';
      data.forEach(day => {
        const groups = day.groups || [];
        html += dayHeaderHtml(day);

        if (groups.length === 0) {
          html += `<div class="status" style="padding:14px">No rooms booked.</div>`;
          return;
        }

        groups.forEach(g => {
          const blocked = g.reservation_status === 'blocked';
          const staying = !blocked && g.stay_status === 'staying';
          const stateClass = blocked ? ' blocked' : (staying ? ' staying' : '');
          const beds = bedText(g.king_bed, g.twin_bed);
          const pref = (g.special_preferences || '').trim();

          html += `<div class="card${stateClass}">
            <div class="card-top">
              <span class="room-no">Room ${escapeHtml(g.room_no)}${blocked ? '<span class="blocked-tag">BLOCKED</span>' : ''}${staying ? '<span class="stay-tag">In-stay</span>' : ''}</span>
              <span class="beds">${beds}</span>
            </div>
            <div class="cust">${escapeHtml(g.primary_customer_name ?? '—')}</div>
            <div class="meta">
              <span class="k">Adults</span><span class="v">${g.adults ?? 0}</span>
              <span class="k">Children</span><span class="v">${g.children ?? 0}</span>
              <span class="k">Children 6+</span><span class="v">${g.children_above_six ?? 0}</span>
              <span class="k">Occupants in Rooms</span><span class="v">${g.total_occupants_for_the_room ?? 0}</span>
              <span class="k">Rooms reserved</span><span class="v">${g.rooms_reserved ?? 0}</span>
              <span class="k">Reserved by</span><span class="v">${escapeHtml(g.reserved_by ?? '—')}</span>
            </div>
            ${pref ? `<div class="pref"><span class="lbl">Special preferences</span>${escapeHtml(pref)}</div>` : ''}
            <div class="refnote">Ref: ${escapeHtml(g.reservation_ref_no ?? '—')}</div>
          </div>`;
        });
      });

      el.className = '';
      el.innerHTML = html;
    }

    // shared date bar (used by both views)
    function dayHeaderHtml(day) {
      const groups = day.groups || [];
      const dt = day.day_totals || {};
      const totalRooms = dt.total_rooms_in_a_day ?? groups.length;
      const totalOcc = dt.total_occupants_for_the_day ?? 0;
      return `<div class="day-header">
        <span>${escapeHtml(prettyDate(day.reserved_date))}</span>
        <span class="day-stats">
          <span class="stat stat-rooms">${totalRooms} rooms</span>
          <span class="stat stat-occ">${totalOcc} guests</span>
        </span>
      </div>`;
    }

    const TABLE_COLS = ['Room', 'Customer', 'Beds', 'Adults', 'Children',
      'Child 6+', 'Occ. in Rooms', 'Rooms Res.', 'Reserved By', 'Ref No', 'Special Preferences'];

    // builds just the <table>…</table> markup, shared by the on-screen view and the image snapshot
    function tableMarkup(data) {
      const cols = TABLE_COLS;
      const colSpan = cols.length;

      let html = '<table class="grid"><thead><tr>';
      cols.forEach((c, i) => {
        html += `<th class="${i === 0 ? 'sticky-col' : ''}">${c}</th>`;
      });
      html += '</tr></thead><tbody>';

      let rowIdx = 0; // for zebra striping across data rows
      data.forEach(day => {
        const groups = day.groups || [];
        const dt = day.day_totals || {};
        const totalRooms = dt.total_rooms_in_a_day ?? groups.length;
        const totalOcc = dt.total_occupants_for_the_day ?? 0;

        // full-width date separator row
        html += `<tr class="date-row"><td colspan="${colSpan}"><div class="date-inner">
          <span>${escapeHtml(prettyDate(day.reserved_date))}</span>
          <span class="stat stat-rooms">${totalRooms} rooms</span>
          <span class="stat stat-occ">${totalOcc} guests</span>
        </div></td></tr>`;

        if (groups.length === 0) {
          html += `<tr><td colspan="${colSpan}" style="color:var(--muted)">No rooms booked.</td></tr>`;
          return;
        }

        groups.forEach(g => {
          const blocked = g.reservation_status === 'blocked';
          const staying = !blocked && g.stay_status === 'staying';
          const stateClass = blocked ? 'blocked-row' : (staying ? 'staying' : '');
          const beds = bedText(g.king_bed, g.twin_bed) || '—';
          const pref = (g.special_preferences || '').trim();
          const alt = (rowIdx++ % 2 === 0) ? ' alt' : '';
          html += `<tr class="${stateClass}${alt}">
            <td class="sticky-col">${stackRooms(g.room_no)}${blocked ? '<br>🔒' : ''}</td>
            <td class="cell-name">${escapeHtml(g.primary_customer_name ?? '—')}${staying ? ' <span class="stay-tag-sm">in-stay</span>' : ''}</td>
            <td>${beds}</td>
            <td>${g.adults ?? 0}</td>
            <td>${g.children ?? 0}</td>
            <td>${g.children_above_six ?? 0}</td>
            <td>${g.total_occupants_for_the_room ?? 0}</td>
            <td>${g.rooms_reserved ?? 0}</td>
            <td>${escapeHtml(g.reserved_by ?? '—')}</td>
            <td>${escapeHtml(g.reservation_ref_no ?? '—')}</td>
            <td class="${pref ? 'cell-pref' : ''}">${pref ? escapeHtml(pref) : '—'}</td>
          </tr>`;
        });
      });

      html += '</tbody></table>';
      return html;
    }

    function renderTable(data) {
      const el = document.getElementById('content');
      if (!data || data.length === 0) {
        el.className = 'status';
        el.textContent = 'No reservations for the selected dates.';
        return;
      }

      el.className = '';
      el.innerHTML = '<div class="table-scroll">' + tableMarkup(data) + '</div>';

      // park the sticky date bar exactly under the column-title row
      const thead = el.querySelector('table.grid thead');
      if (thead) document.documentElement.style.setProperty('--grid-head-h', thead.offsetHeight + 'px');
    }

    let lastImageFile = null; // the generated PNG, shared/saved from the popup

    // Capture the whole table (incl. off-screen parts) and show it in the save popup.
    async function saveTableImage() {
      if (!lastData || !lastData.length) { alert('Nothing to save yet — fetch some dates first.'); return; }
      if (typeof html2canvas === 'undefined') { alert('Image library not loaded. Check your connection and try again.'); return; }

      const btn = document.getElementById('saveImgBtn');
      const label = btn.textContent;
      btn.textContent = 'Saving…';
      btn.disabled = true;

      const start = document.getElementById('startDate').value;
      const end = document.getElementById('endDate').value;

      // render the full table off-screen (no scroll box, no sticky)
      const wrap = document.createElement('div');
      wrap.className = 'capture';
      wrap.innerHTML =
        `<div class="cap-title">Legphel Housekeeping &nbsp;·&nbsp; ${escapeHtml(prettyDate(start))} – ${escapeHtml(prettyDate(end))}</div>`
        + tableMarkup(lastData);
      document.body.appendChild(wrap);

      try {
        const canvas = await html2canvas(wrap, { scale: 2, backgroundColor: '#ffffff' });
        const fileName = `housekeeping_${start}_to_${end}.png`;

        // show the image in the popup so the user can long-press to save (iOS-safe)
        document.getElementById('modalImg').src = canvas.toDataURL('image/png');

        // prepare a File for the Share/Save button (fired by a fresh tap inside the popup)
        await new Promise(resolve => canvas.toBlob(blob => {
          lastImageFile = blob ? new File([blob], fileName, { type: 'image/png' }) : null;
          resolve();
        }, 'image/png'));

        document.getElementById('imgModal').style.display = 'flex';
      } catch (err) {
        alert('Could not create image: ' + err.message);
      } finally {
        document.body.removeChild(wrap);
        btn.textContent = label;
        btn.disabled = false;
      }
    }

    // Share/save the generated image — runs on a direct tap so iOS allows it.
    async function shareImage() {
      if (!lastImageFile) return;
      if (navigator.canShare && navigator.canShare({ files: [lastImageFile] })) {
        try {
          await navigator.share({ files: [lastImageFile], title: 'Housekeeping' });
        } catch (e) { /* user dismissed the share sheet */ }
      } else {
        const url = URL.createObjectURL(lastImageFile);
        const link = document.createElement('a');
        link.download = lastImageFile.name;
        link.href = url;
        link.click();
        URL.revokeObjectURL(url);
      }
    }

    // pick the active view
    function draw() {
      if (!lastData) return;
      if (view === 'table') renderTable(lastData);
      else render(lastData);
    }

    async function fetchAndRender() {
      const start = document.getElementById('startDate').value;
      const end = document.getElementById('endDate').value;
      if (!start || !end) return;

      document.getElementById('rangeLabel').textContent =
        `${prettyDate(start)} – ${prettyDate(end)}`;

      const el = document.getElementById('content');
      el.className = 'status';
      el.textContent = 'Loading…';

      try {
        const headers = auth ? { Authorization: 'Bearer ' + auth.token } : {};
        const resp = await fetch(`${apiBase}?start_date=${start}&end_date=${end}`, { headers });
        if (resp.status === 401) { // token missing/expired
          clearAuth(); auth = null; showLogin();
          return;
        }
        if (!resp.ok) throw new Error('Could not load data (' + resp.status + ')');
        lastData = await resp.json();
        draw();
      } catch (err) {
        el.className = 'status error';
        el.textContent = 'Error: ' + err.message;
      }
    }

    // Keep the sticky date headers parked exactly under the top bar,
    // even when the controls wrap to more rows on narrow screens.
    function syncHeaderHeight() {
      const h = document.querySelector('header').offsetHeight;
      document.documentElement.style.setProperty('--header-h', h + 'px');
    }

    // ---- login / logout / role UI ----
    function showLogin() {
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('loginPin').value = '';
      document.getElementById('loginUser').focus();
    }
    function hideLogin() {
      document.getElementById('loginScreen').style.display = 'none';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('loginUser').value.trim();
      const pin = document.getElementById('loginPin').value;
      const errEl = document.getElementById('loginError');
      const btn = document.getElementById('loginBtn');
      errEl.textContent = '';
      if (!username || !pin) { errEl.textContent = 'Enter username and PIN'; return; }
      btn.disabled = true; const lbl = btn.textContent; btn.textContent = 'Logging in…';
      try {
        const resp = await fetch(FN + '/login', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ username, password: pin }),
        });
        const data = await resp.json();
        if (!resp.ok) { errEl.textContent = data.error || 'Login failed'; return; }
        auth = data; saveAuth(auth);
        document.getElementById('loginPin').value = '';
        startApp();
      } catch (err) {
        errEl.textContent = 'Network error: ' + err.message;
      } finally {
        btn.disabled = false; btn.textContent = lbl;
      }
    }

    function logout() {
      clearAuth(); auth = null; lastData = null;
      document.getElementById('adminModal').style.display = 'none';
      document.getElementById('imgModal').style.display = 'none';
      showLogin();
    }

    function applyRoleUI() {
      const role = auth && auth.user ? auth.user.role : null;
      document.getElementById('userLabel').textContent =
        auth ? `${auth.user.full_name} · ${roleLabel(role)}` : '';
      document.getElementById('adminBtn').style.display =
        (role === 'admin' || role === 'gm') ? '' : 'none';

      // Housekeeping: lock the date pickers to the allowed window.
      const startEl = document.getElementById('startDate');
      const endEl = document.getElementById('endDate');
      if (role === 'housekeeping') {
        const today = thimphuToday();
        const before = (auth.policy && auth.policy.days_before != null) ? auth.policy.days_before : 1;
        const after = (auth.policy && auth.policy.days_after != null) ? auth.policy.days_after : 1;
        const minD = fmt(addDays(today, -before));
        const maxD = fmt(addDays(today, after));
        [startEl, endEl].forEach(el => { el.min = minD; el.max = maxD; });
      } else {
        [startEl, endEl].forEach(el => { el.removeAttribute('min'); el.removeAttribute('max'); });
      }
    }

    function startApp() {
      hideLogin();
      applyRoleUI();
      initDates();
      syncHeaderHeight();
      fetchAndRender();
    }

    function initDates() {
      const today = thimphuToday();
      const tomorrow = nextDay(today);
      document.getElementById('startDate').value = fmt(today);
      document.getElementById('endDate').value = fmt(tomorrow);
    }

    // ---- admin console ----
    async function openAdmin() {
      const msg = document.getElementById('adminMsg');
      msg.textContent = ''; msg.className = 'admin-msg';
      const isAdmin = auth && auth.user && auth.user.role === 'admin';
      document.getElementById('savePolicyBtn').style.display = isAdmin ? '' : 'none';
      document.getElementById('daysBefore').disabled = !isAdmin;
      document.getElementById('daysAfter').disabled = !isAdmin;
      document.getElementById('adminModal').style.display = 'flex';
      try {
        const resp = await fetch(FN + '/policy', { headers: { Authorization: 'Bearer ' + auth.token } });
        const data = await resp.json();
        if (!resp.ok) { msg.textContent = data.error || 'Could not load'; msg.className = 'admin-msg err'; return; }
        document.getElementById('daysBefore').value = data.days_before;
        document.getElementById('daysAfter').value = data.days_after;
      } catch (err) {
        msg.textContent = 'Network error: ' + err.message; msg.className = 'admin-msg err';
      }
    }

    async function savePolicy() {
      const msg = document.getElementById('adminMsg');
      msg.textContent = 'Saving…'; msg.className = 'admin-msg';
      const days_before = document.getElementById('daysBefore').value;
      const days_after = document.getElementById('daysAfter').value;
      try {
        const resp = await fetch(FN + '/policy', {
          method: 'POST',
          headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + auth.token },
          body: JSON.stringify({ days_before, days_after }),
        });
        const data = await resp.json();
        if (!resp.ok) { msg.textContent = data.error || 'Save failed'; msg.className = 'admin-msg err'; return; }
        msg.textContent = 'Saved.'; msg.className = 'admin-msg ok';
        if (auth.policy) { auth.policy.days_before = data.days_before; auth.policy.days_after = data.days_after; saveAuth(auth); }
      } catch (err) {
        msg.textContent = 'Network error: ' + err.message; msg.className = 'admin-msg err';
      }
    }

    // ---- wire up static listeners once ----
    function wireUp() {
      const startEl = document.getElementById('startDate');
      const endEl = document.getElementById('endDate');
      startEl.addEventListener('change', function () {
        if (this.value) endEl.value = fmt(nextDay(new Date(this.value)));
      });

      document.getElementById('fetchBtn').addEventListener('click', fetchAndRender);
      document.getElementById('viewToggleBtn').addEventListener('click', function () {
        view = view === 'cards' ? 'table' : 'cards';
        this.textContent = view === 'cards' ? '▦ Table view' : '▤ Card view';
        document.getElementById('saveImgBtn').style.display = view === 'table' ? '' : 'none';
        draw();
        syncHeaderHeight();
        window.scrollTo(0, 0);
      });
      document.getElementById('saveImgBtn').addEventListener('click', saveTableImage);
      document.getElementById('shareImgBtn').addEventListener('click', shareImage);
      document.getElementById('closeModalBtn').addEventListener('click', function () {
        document.getElementById('imgModal').style.display = 'none';
      });

      document.getElementById('loginForm').addEventListener('submit', handleLogin);
      document.getElementById('logoutBtn').addEventListener('click', logout);
      document.getElementById('adminBtn').addEventListener('click', openAdmin);
      document.getElementById('savePolicyBtn').addEventListener('click', savePolicy);
      document.getElementById('closeAdminBtn').addEventListener('click', function () {
        document.getElementById('adminModal').style.display = 'none';
      });

      window.addEventListener('resize', syncHeaderHeight);
    }

    function boot() {
      wireUp();
      if (DEV) { startApp(); return; }       // local file: no login
      auth = loadAuth();
      if (tokenValid(auth)) startApp();
      else { clearAuth(); auth = null; showLogin(); }
    }

    document.addEventListener('DOMContentLoaded', boot);
  </script>
</body>
